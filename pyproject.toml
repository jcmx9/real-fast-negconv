[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "real-fast-negconv"
dynamic = ["version"]
description = "Convert RAW scans of film negatives into neutral DNG, TIFF and JPEG positives."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [
    { name = "jcmx9", email = "jcmx9@tutamail.com" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Multimedia :: Graphics",
]
dependencies = [
    "typer>=0.12",
    "pydantic>=2.0",
    "rawpy>=0.19",
    "numpy>=1.26",
    "tifffile>=2024.1",
    "imagecodecs>=2024.1",
    "opencv-python-headless>=4.9",
    "Pillow>=10.0,<12.0",
    "watchdog>=4.0",
    "platformdirs>=4.0",
]

[project.scripts]
rfnegconv = "real_fast_negconv.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-xdist>=3.5",
    "ruff>=0.4",
    "mypy>=1.10",
    "bump-my-version>=1.1",
    "pre-commit>=3.7",
    "types-Pillow",
]

[project.urls]
Homepage = "https://github.com/jcmx9/real-fast-negconv"
Repository = "https://github.com/jcmx9/real-fast-negconv"
Issues = "https://github.com/jcmx9/real-fast-negconv/issues"

[tool.hatch.version]
path = "src/real_fast_negconv/__init__.py"

[tool.bumpversion]
current_version = "26.10.8"
commit = true
tag = true
tag_name = "v{new_version}"
tag_message = "Release {new_version}"
commit_message = "release: {new_version}"
parse = "(?P<year>\\d{2})\\.(?P<month>\\d{1,2})\\.(?P<micro>\\d+)(\\.dev(?P<dev>\\d+))?"
serialize = [
    "{year}.{month}.{micro}.dev{dev}",
    "{year}.{month}.{micro}",
]

[[tool.bumpversion.files]]
filename = "src/real_fast_negconv/__init__.py"
search = '__version__ = "{current_version}"'
replace = '__version__ = "{new_version}"'

[[tool.bumpversion.files]]
filename = "install.sh"
search = 'RFNEGCONV_VERSION="{current_version}"'
replace = 'RFNEGCONV_VERSION="{new_version}"'

[[tool.bumpversion.files]]
filename = "install.ps1"
search = "$script:Version = '{current_version}'"
replace = "$script:Version = '{new_version}'"

[[tool.bumpversion.files]]
filename = "README.md"
search = "**Version {current_version}**"
replace = "**Version {new_version}**"

[[tool.bumpversion.files]]
filename = "README.en.md"
search = "**Version {current_version}**"
replace = "**Version {new_version}**"

[[tool.bumpversion.files]]
filename = "README.md"
search = "`rfnegconv {current_version} | color"
replace = "`rfnegconv {new_version} | color"

[[tool.bumpversion.files]]
filename = "README.en.md"
search = "`rfnegconv {current_version} | color"
replace = "`rfnegconv {new_version} | color"

[[tool.bumpversion.files]]
filename = "README.md"
search = "(z. B. `{current_version}`)"
replace = "(z. B. `{new_version}`)"

[[tool.bumpversion.files]]
filename = "README.en.md"
search = "(e.g. `{current_version}`)"
replace = "(e.g. `{new_version}`)"

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src/real_fast_negconv --cov-report=term-missing -n auto -m 'not real'"
markers = ["real: tests against real RAW files in testdata/ (opt-in: pytest -m real)"]

[tool.mypy]
python_version = "3.12"
strict = true

[[tool.mypy.overrides]]
module = ["rawpy.*", "tifffile.*", "watchdog.*", "imagecodecs.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["cv2", "cv2.*"]
follow_imports = "skip"
ignore_missing_imports = true

[tool.coverage.run]
source = ["src/real_fast_negconv"]
branch = true
omit = ["*/__main__.py"]

[tool.coverage.report]
fail_under = 80
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "@(abc\\.)?abstractmethod",
]
