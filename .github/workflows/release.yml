name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  # a release is only published when the full CI passes on the tagged commit
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  publish:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.13"
      - run: uv build
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
